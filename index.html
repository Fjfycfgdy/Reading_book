<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جلسه کتابخوانی استاد سلوداری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7;
    --paper:#fffdf8;
    --ink:#2b2620;
    --accent:#8c2f39;
    --accent-soft:#b3545e;
    --gold:#c8a250;
    --line:#e6ddcc;
    --shadow:0 14px 32px -18px rgba(60,45,25,.45);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}

  body{
    font-family:"Vazirmatn", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #fffaf0 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, #f1e8d6 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    line-height:1.9;
    min-height:100vh;
    padding:44px 20px;
  }

  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(140,47,57,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,47,57,.035) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:960px;
    margin:0 auto;
    text-align:center;
  }

  h1{
    font-size:clamp(1.7rem,4.6vw,2.8rem);
    font-weight:800;
    color:var(--accent);
    margin-bottom:34px;
    position:relative;
    padding-bottom:18px;
  }
  h1::after{
    content:"";
    position:absolute;right:50%;transform:translateX(50%);
    bottom:0;
    width:90px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.75;
  }

  img.main-image{
    display:inline-block;
    max-width:100%;
    height:auto;
    vertical-align:middle;
    animation:rise .9s cubic-bezier(.2,.9,.3,1) both;
  }

  /* ============ کادر بزرگ هر پوشه ============ */
  .folders{
    display:flex;
    flex-direction:column;
    gap:26px;
    margin-top:48px;
    text-align:right;
  }

  .folder-box{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:rise .7s cubic-bezier(.2,.9,.3,1) both;
  }

  /* تایتل کادر = نام پوشه */
  .folder-box-title{
    font-size:1.2rem;
    font-weight:800;
    color:var(--accent);
    padding:20px 28px 16px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(90deg, rgba(200,162,80,.12), transparent 75%);
    position:relative;
  }
  .folder-box-title::before{
    content:"";
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:5px;height:24px;border-radius:4px;
    background:linear-gradient(180deg,var(--accent),var(--gold));
  }

  /* داخل کادر: شبکه کارت‌ها */
  .folder-box-body{
    padding:22px 28px 26px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:18px;
  }

  /* ============ کارت هر موزیک/ویدیو ============ */
  .file-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    transition:transform .25s, border-color .25s, box-shadow .25s;
    min-width:0;
  }
  .file-card:hover{
    border-color:var(--accent-soft);
    box-shadow:0 12px 28px -18px rgba(140,47,57,.5);
    transform:translateY(-2px);
  }

  .file-title{
    font-size:1rem;
    font-weight:700;
    color:var(--accent);
    word-break:break-word;
    line-height:1.5;
  }

  .file-card audio{
    width:100%;
    height:40px;
    border-radius:8px;
    outline:none;
    background:#faf7f0;
  }

  .file-card video{
    width:100%;
    border-radius:10px;
    background:#000;
    outline:none;
    aspect-ratio:16/9;
    object-fit:contain;
  }

  .download-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 18px;
    background:linear-gradient(135deg, var(--accent), #6b2129);
    color:#fff;
    border:none;
    border-radius:11px;
    font-weight:700;
    font-size:.9rem;
    font-family:inherit;
    cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    box-shadow:0 10px 20px -10px rgba(140,47,57,.8);
  }
  .download-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 26px -10px rgba(140,47,57,1);
  }
  .download-btn:disabled{cursor:not-allowed;opacity:.85;transform:none}

  /* ============ وضعیت‌ها ============ */
  .status{
    padding:30px 20px;
    color:#9a8f7e;
    font-size:.9rem;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:20px;
    background:rgba(255,253,248,.6);
    margin-top:40px;
  }
  .notice{
    display:inline-flex;align-items:center;gap:8px;
    margin:28px auto 0;
    padding:8px 18px;
    font-size:.8rem;
    background:rgba(200,162,80,.15);
    color:#7a5c1a;
    border:1px solid rgba(200,162,80,.4);
    border-radius:999px;
  }

  .spinner{
    display:inline-block;
    width:18px;height:18px;
    border:2.5px solid rgba(140,47,57,.2);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @keyframes rise{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
  }
</style>
</head>
<body>

  <div class="wrap">
    <h1>جلسه کتابخوانی استاد سلوداری</h1>
    <img class="main-image" src="image.png" alt="جلسه کتابخوانی استاد سلوداری">

    <div id="loading" class="status">در حال بارگذاری<span class="spinner"></span></div>
    <div id="notice" class="notice" style="display:none">⚠️ دیتای نمونه — فایل واقعی یافت نشد</div>
    <div class="folders" id="folders"></div>
  </div>

<script>
  /* ==========================================================
     ساختار:
       هر پوشه → یک کادر بزرگ با تایتل نام پوشه
       داخل کادر → کارت‌های موزیک/ویدیو با پیش‌نمایش + دانلود
     اگر API گیت‌هاب در دسترس نبود → دیتای پیش‌فرض نمونه
     ========================================================== */

  const MUSIC_EXTS = new Set(['mp3','wav','ogg','m4a','flac','aac','opus','wma','oga']);
  const VIDEO_EXTS = new Set(['mp4','webm','mov','avi','mkv','m4v','ogv','3gp']);

  const loadingEl = document.getElementById('loading');
  const foldersEl = document.getElementById('folders');
  const noticeEl  = document.getElementById('notice');

  /* ============ دیتای پیش‌فرض (وقتی API نیست) ============ */
  const DEFAULT_DATA = {
    "جلسه اول": [
      { name: "مقدمه کتاب.mp3",      url: "#", kind: "music" },
      { name: "بخش اول - خوانش.mp4", url: "#", kind: "video" }
    ],
    "جلسه دوم": [
      { name: "تحلیل فصل یک.mp3",   url: "#", kind: "music" },
      { name: "پرسش و پاسخ.mp4",    url: "#", kind: "video" }
    ],
    "جلسه سوم": [
      { name: "جمع‌بندی استاد.mp3", url: "#", kind: "music" }
    ]
  };

  function getExt(name){
    const i = name.lastIndexOf('.');
    return i < 0 ? '' : name.slice(i + 1).toLowerCase();
  }

  function getKind(name){
    const ext = getExt(name);
    if (MUSIC_EXTS.has(ext)) return 'music';
    if (VIDEO_EXTS.has(ext)) return 'video';
    return null;
  }

  function stripExt(name){
    const i = name.lastIndexOf('.');
    return i > 0 ? name.slice(0, i) : name;
  }

  function shouldSkip(name){
    return name.startsWith('.') || name.startsWith('_');
  }

  function detectRepo(){
    const host = location.hostname;
    if (!host.endsWith('.github.io')) return null;
    const user = host.slice(0, -'.github.io'.length);
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length === 0) return { user, repo: host, basePath: '' };
    return { user, repo: parts[0], basePath: parts.slice(1).join('/') };
  }

  async function fetchFromGitHub(){
    const info = detectRepo();
    if (!info) throw new Error('offline');

    const repoRes = await fetch(`https://api.github.com/repos/${info.user}/${info.repo}`);
    if (!repoRes.ok) throw new Error('repo-fail');
    const repoInfo = await repoRes.json();
    const branch = repoInfo.default_branch;

    const treeRes = await fetch(
      `https://api.github.com/repos/${info.user}/${info.repo}/git/trees/${branch}?recursive=1`
    );
    if (!treeRes.ok) throw new Error('tree-fail');
    const treeData = await treeRes.json();
    const items = treeData.tree || [];
    const basePath = info.basePath ? info.basePath + '/' : '';

    const folders = {};
    items.forEach(item => {
      if (item.type !== 'blob') return;
      if (basePath && !item.path.startsWith(basePath)) return;

      const relPath = item.path.slice(basePath.length);
      const parts = relPath.split('/');
      if (parts.length !== 2) return;

      const folderName = parts[0];
      if (shouldSkip(folderName)) return;

      const fileName = parts[1];
      const kind = getKind(fileName);
      if (!kind) return;

      const url = relPath.split('/').map(encodeURIComponent).join('/');
      if (!folders[folderName]) folders[folderName] = [];
      folders[folderName].push({ name: fileName, url, kind });
    });

    Object.keys(folders).forEach(k => {
      folders[k].sort((a, b) => a.name.localeCompare(b.name, 'fa', { numeric:true }));
    });

    if (Object.keys(folders).length === 0) throw new Error('empty');
    return folders;
  }

  /* ============ دانلود واقعی ============ */
  async function downloadFile(url, filename, btn){
    // اگر URL پیش‌فرض (#) بود، دانلود واقعی نداریم
    if (!url || url === '#'){
      const original = btn.innerHTML;
      btn.innerHTML = '⚠️ فایل نمونه';
      setTimeout(() => { btn.innerHTML = original; }, 1500);
      return;
    }

    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⏳ در حال دانلود…';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(objUrl), 2000);
      btn.innerHTML = '✓ دانلود شد';
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1800);
    } catch (err) {
      console.error(err);
      btn.innerHTML = '✗ خطا';
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1800);
    }
  }

  /* ============ ساخت کارت فایل ============ */
  function createFileCard(file){
    const card = document.createElement('div');
    card.className = 'file-card';

    const title = document.createElement('div');
    title.className = 'file-title';
    title.textContent = stripExt(file.name);
    card.appendChild(title);

    const hasRealSrc = file.url && file.url !== '#';

    if (file.kind === 'music'){
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      if (hasRealSrc) audio.src = file.url;
      card.appendChild(audio);
    } else {
      const video = document.createElement('video');
      video.controls = true;
      video.preload = 'none';
      if (hasRealSrc) video.src = file.url;
      card.appendChild(video);
    }

    const dl = document.createElement('button');
    dl.type = 'button';
    dl.className = 'download-btn';
    dl.innerHTML = '⬇ دانلود';
    dl.addEventListener('click', () => downloadFile(file.url, file.name, dl));
    card.appendChild(dl);

    return card;
  }

  /* ============ ساخت کادر بزرگ هر پوشه ============ */
  function renderFolders(folders){
    foldersEl.innerHTML = '';
    const names = Object.keys(folders).sort((a, b) =>
      a.localeCompare(b, 'fa', { numeric:true })
    );

    names.forEach((folderName, i) => {
      const box = document.createElement('div');
      box.className = 'folder-box';
      box.style.animationDelay = (i * 0.08) + 's';

      // تایتل کادر = نام پوشه
      const title = document.createElement('div');
      title.className = 'folder-box-title';
      title.textContent = folderName;
      box.appendChild(title);

      // بدنه: کارت‌های فایل
      const body = document.createElement('div');
      body.className = 'folder-box-body';

      folders[folderName].forEach(file => {
        body.appendChild(createFileCard(file));
      });

      box.appendChild(body);
      foldersEl.appendChild(box);
    });
  }

  /* ============ اجرای اصلی ============ */
  (async () => {
    try {
      const real = await fetchFromGitHub();
      loadingEl.style.display = 'none';
      renderFolders(real);
    } catch (err) {
      console.warn('استفاده از دیتای پیش‌فرض:', err.message);
      loadingEl.style.display = 'none';
      noticeEl.style.display = 'inline-flex';
      renderFolders(DEFAULT_DATA);
    }
  })();
</script>

</body>
</html>
