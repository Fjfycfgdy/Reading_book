<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جلسه کتابخوانی استاد سلوداری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7;
    --paper:#fffdf8;
    --ink:#2b2620;
    --muted:#7a6f60;
    --accent:#8c2f39;
    --accent-soft:#b3545e;
    --gold:#c8a250;
    --line:#e6ddcc;
    --shadow:0 14px 32px -18px rgba(60,45,25,.45);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}

  body{
    font-family:"Vazirmatn", system-ui, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #fffaf0 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, #f1e8d6 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    line-height:1.9;
    min-height:100vh;
    padding:44px 20px;
  }

  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(140,47,57,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,47,57,.035) 1px, transparent 1px);
    background-size:34px 34px;
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:900px;
    margin:0 auto;
    text-align:center;
  }

  h1{
    font-size:clamp(1.7rem,4.6vw,2.8rem);
    font-weight:800;
    letter-spacing:-.01em;
    line-height:1.5;
    color:var(--accent);
    margin-bottom:34px;
    position:relative;
    padding-bottom:18px;
  }
  h1::after{
    content:"";
    position:absolute;right:50%;transform:translateX(50%);
    bottom:0;
    width:90px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.75;
  }

  img.main-image{
    display:inline-block;
    max-width:100%;
    height:auto;
    vertical-align:middle;
    animation:rise .9s cubic-bezier(.2,.9,.3,1) both;
  }

  .section-title{
    font-size:1.25rem;
    font-weight:800;
    color:var(--accent);
    margin:52px 0 22px;
    text-align:right;
    padding-right:14px;
    border-right:4px solid var(--gold);
    border-radius:3px;
  }

  /* ======== کادرهای موسیقی ======== */
  .music-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
    text-align:right;
  }

  .music-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    gap:14px;
    animation:rise .7s cubic-bezier(.2,.9,.3,1) both;
    transition:transform .3s, border-color .3s, box-shadow .3s;
  }
  .music-card:hover{
    border-color:var(--accent-soft);
    box-shadow:0 18px 36px -18px rgba(140,47,57,.45);
  }

  .music-title{
    font-size:1.02rem;
    font-weight:800;
    color:var(--accent);
    word-break:break-word;
    line-height:1.5;
  }

  .music-folder{
    font-size:.74rem;
    color:#9a8f7e;
    margin-top:-6px;
    font-weight:500;
  }

  .music-card audio{
    width:100%;
    height:42px;
    border-radius:10px;
    outline:none;
    background:#fff;
  }

  /* دکمه دانلود */
  .download-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 20px;
    background:linear-gradient(135deg, var(--accent), #6b2129);
    color:#fff;
    border:none;
    border-radius:12px;
    font-weight:700;
    font-size:.92rem;
    font-family:inherit;
    cursor:pointer;
    transition:transform .2s, box-shadow .2s, background .2s;
    box-shadow:0 10px 20px -10px rgba(140,47,57,.8);
  }
  .download-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 26px -10px rgba(140,47,57,1);
  }
  .download-btn:active{transform:translateY(0)}
  .download-btn:disabled{
    cursor:not-allowed;
    opacity:.85;
    transform:none;
  }

  /* ======== کادرهای ویدیو (پوشه‌ها) ======== */
  .folders{
    display:flex;
    flex-direction:column;
    gap:22px;
    text-align:right;
  }

  .folder{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
    animation:rise .7s cubic-bezier(.2,.9,.3,1) both;
  }

  .folder-title{
    font-size:1.12rem;
    font-weight:800;
    color:var(--accent);
    padding:18px 26px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(90deg, rgba(200,162,80,.10), transparent 75%);
    position:relative;
  }
  .folder-title::before{
    content:"";
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:4px;height:22px;border-radius:4px;
    background:linear-gradient(180deg,var(--accent),var(--gold));
  }

  .video-list{
    padding:20px 26px 24px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .video-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    transition:border-color .25s, box-shadow .25s;
  }
  .video-card:hover{
    border-color:var(--accent-soft);
    box-shadow:0 12px 26px -18px rgba(140,47,57,.5);
  }

  .video-title{
    font-size:.98rem;
    font-weight:700;
    color:var(--accent);
    word-break:break-word;
    line-height:1.5;
  }

  .video-card video{
    width:100%;
    border-radius:10px;
    background:#000;
    outline:none;
    aspect-ratio:16/9;
    object-fit:contain;
  }

  /* حالت بارگذاری / خطا */
  .status{
    padding:34px 20px;
    color:#9a8f7e;
    font-size:.9rem;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:20px;
    background:rgba(255,253,248,.6);
    margin-top:40px;
  }
  .status.error{color:var(--accent);border-color:rgba(140,47,57,.35)}

  .spinner{
    display:inline-block;
    width:20px;height:20px;
    border:2.5px solid rgba(140,47,57,.2);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @keyframes rise{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
  }
</style>
</head>
<body>

  <div class="wrap">
    <h1>جلسه کتابخوانی استاد سلوداری</h1>
    <img class="main-image" src="image.png" alt="جلسه کتابخوانی استاد سلوداری">

    <div id="loading" class="status">در حال بارگذاری<span class="spinner"></span></div>

    <section id="music-section" style="display:none">
      <h2 class="section-title">🎵 موسیقی</h2>
      <div class="music-grid" id="music-grid"></div>
    </section>

    <section id="video-section" style="display:none">
      <h2 class="section-title">🎬 ویدیو</h2>
      <div class="folders" id="folders"></div>
    </section>

    <div id="error" class="status error" style="display:none"></div>
    <div id="empty" class="status" style="display:none">هنوز فایل موسیقی یا ویدیویی اضافه نشده.</div>
  </div>

<script>
  /* ==========================================================
     فقط موسیقی و ویدیو نمایش داده می‌شود.
     موسیقی: کادر مستقل با تایتل + پخش‌کننده + دانلود
     ویدیو: داخل کادر پوشه‌ها، هر ویدیو با پخش‌کننده + دانلود
     دکمه دانلود: با fetch + blob واقعاً دانلود می‌کند (بدون هدایت به raw)
     ========================================================== */

  const MUSIC_EXTS = new Set(['mp3','wav','ogg','m4a','flac','aac','opus','wma','oga']);
  const VIDEO_EXTS = new Set(['mp4','webm','mov','avi','mkv','m4v','ogv','3gp']);

  const loadingEl = document.getElementById('loading');
  const musicSectionEl = document.getElementById('music-section');
  const musicGridEl = document.getElementById('music-grid');
  const videoSectionEl = document.getElementById('video-section');
  const foldersEl = document.getElementById('folders');
  const errorEl = document.getElementById('error');
  const emptyEl = document.getElementById('empty');

  function getExt(name){
    const i = name.lastIndexOf('.');
    if (i < 0) return '';
    return name.slice(i + 1).toLowerCase();
  }

  function getKind(name){
    const ext = getExt(name);
    if (MUSIC_EXTS.has(ext)) return 'music';
    if (VIDEO_EXTS.has(ext)) return 'video';
    return null;
  }

  function stripExt(name){
    const i = name.lastIndexOf('.');
    return i > 0 ? name.slice(0, i) : name;
  }

  function shouldSkip(name){
    return name.startsWith('.') || name.startsWith('_');
  }

  function detectRepo(){
    const host = location.hostname;
    if (!host.endsWith('.github.io')) return null;
    const user = host.slice(0, -'.github.io'.length);
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts.length === 0) return { user, repo: host, basePath: '' };
    return { user, repo: parts[0], basePath: parts.slice(1).join('/') };
  }

  async function loadStructure(){
    const info = detectRepo();
    if (!info) throw new Error('این صفحه فقط روی GitHub Pages کار می‌کند.');

    const repoRes = await fetch(`https://api.github.com/repos/${info.user}/${info.repo}`);
    if (!repoRes.ok){
      if (repoRes.status === 404) throw new Error('ریپو پیدا نشد.');
      if (repoRes.status === 403 || repoRes.status === 429)
        throw new Error('محدودیت درخواست GitHub — کمی بعد دوباره امتحان کن.');
      throw new Error('خطا در دریافت اطلاعات ریپو (' + repoRes.status + ')');
    }
    const repoInfo = await repoRes.json();
    const branch = repoInfo.default_branch;

    const treeRes = await fetch(
      `https://api.github.com/repos/${info.user}/${info.repo}/git/trees/${branch}?recursive=1`
    );
    if (!treeRes.ok) throw new Error('خطا در دریافت فایل‌ها (' + treeRes.status + ')');

    const treeData = await treeRes.json();
    const items = treeData.tree || [];
    const basePath = info.basePath ? info.basePath + '/' : '';

    const musicFiles = [];
    const videoFolders = {};

    items.forEach(item => {
      if (item.type !== 'blob') return;
      if (basePath && !item.path.startsWith(basePath)) return;

      const relPath = item.path.slice(basePath.length);
      const parts = relPath.split('/');
      if (parts.length !== 2) return;

      const folderName = parts[0];
      if (shouldSkip(folderName)) return;

      const fileName = parts[1];
      const kind = getKind(fileName);
      if (!kind) return;

      const url = relPath.split('/').map(encodeURIComponent).join('/');

      if (kind === 'music'){
        musicFiles.push({ name: fileName, folder: folderName, url });
      } else {
        if (!videoFolders[folderName]) videoFolders[folderName] = [];
        videoFolders[folderName].push({ name: fileName, url });
      }
    });

    musicFiles.sort((a, b) => {
      if (a.folder !== b.folder) return a.folder.localeCompare(b.folder, 'fa', { numeric:true });
      return a.name.localeCompare(b.name, 'fa', { numeric:true });
    });

    Object.keys(videoFolders).forEach(k => {
      videoFolders[k].sort((a, b) =>
        a.name.localeCompare(b.name, 'fa', { numeric:true })
      );
    });

    return { musicFiles, videoFolders };
  }

  /* ============================================
     دانلود واقعی با fetch + blob
     (به raw هدایت نمی‌کند، فایل را ذخیره می‌کند)
     ============================================ */
  async function downloadFile(url, filename, btn){
    if (!btn) return;
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⏳ در حال دانلود…';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);

      btn.innerHTML = '✓ دانلود شد';
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }, 1800);
    } catch (err) {
      console.error('Download failed:', err);
      btn.innerHTML = '✗ خطا در دانلود';
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }, 2000);
    }
  }

  function renderMusic(files){
    musicGridEl.innerHTML = '';
    files.forEach((f, i) => {
      const card = document.createElement('div');
      card.className = 'music-card';
      card.style.animationDelay = (i * 0.06) + 's';

      const title = document.createElement('div');
      title.className = 'music-title';
      title.textContent = stripExt(f.name);

      const folderHint = document.createElement('div');
      folderHint.className = 'music-folder';
      folderHint.textContent = f.folder;

      const audio = document.createElement('audio');
      audio.controls = true;
      audio.preload = 'none';
      audio.src = f.url;

      const dl = document.createElement('button');
      dl.type = 'button';
      dl.className = 'download-btn';
      dl.innerHTML = '⬇ دانلود';
      dl.addEventListener('click', () => downloadFile(f.url, f.name, dl));

      card.appendChild(title);
      card.appendChild(folderHint);
      card.appendChild(audio);
      card.appendChild(dl);
      musicGridEl.appendChild(card);
    });
  }

  function renderVideos(folders){
    foldersEl.innerHTML = '';
    const names = Object.keys(folders).sort((a, b) =>
      a.localeCompare(b, 'fa', { numeric:true })
    );

    names.forEach((folderName, i) => {
      const folderDiv = document.createElement('div');
      folderDiv.className = 'folder';
      folderDiv.style.animationDelay = (i * 0.08) + 's';

      const title = document.createElement('div');
      title.className = 'folder-title';
      title.textContent = folderName;
      folderDiv.appendChild(title);

      const list = document.createElement('div');
      list.className = 'video-list';

      folders[folderName].forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';

        const vTitle = document.createElement('div');
        vTitle.className = 'video-title';
        vTitle.textContent = stripExt(v.name);

        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'none';
        video.src = v.url;

        const dl = document.createElement('button');
        dl.type = 'button';
        dl.className = 'download-btn';
        dl.innerHTML = '⬇ دانلود';
        dl.addEventListener('click', () => downloadFile(v.url, v.name, dl));

        card.appendChild(vTitle);
        card.appendChild(video);
        card.appendChild(dl);
        list.appendChild(card);
      });

      folderDiv.appendChild(list);
      foldersEl.appendChild(folderDiv);
    });
  }

  function finalize(data){
    loadingEl.style.display = 'none';

    const hasMusic = data.musicFiles.length > 0;
    const hasVideos = Object.keys(data.videoFolders).length > 0;

    if (!hasMusic && !hasVideos){
      emptyEl.style.display = 'block';
      return;
    }

    if (hasMusic){
      musicSectionEl.style.display = 'block';
      renderMusic(data.musicFiles);
    }

    if (hasVideos){
      videoSectionEl.style.display = 'block';
      renderVideos(data.videoFolders);
    }
  }

  function fail(msg){
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = '⚠️ ' + msg;
  }

  loadStructure()
    .then(finalize)
    .catch(err => fail(err.message || 'خطای ناشناخته'));
</script>

</body>
</html>
